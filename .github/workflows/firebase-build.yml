name: Build CrazyTube Firebase APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Android project
        run: flutter create --platforms=android --org com.crazytube .

      - name: Copy Firebase configuration
        run: |
          mkdir -p android/app
          cp google-services.json android/app/google-services.json

      - name: Configure Firebase Gradle plugin
        run: |
          python3 - <<'PY'
          from pathlib import Path

          settings = Path("android/settings.gradle.kts")
          text = settings.read_text()

          if "com.google.gms.google-services" not in text:
              text = text.replace(
                  "plugins {",
                  "plugins {\n    id(\"com.google.gms.google-services\") version \"4.4.2\" apply false",
                  1
              )
              settings.write_text(text)

          app = Path("android/app/build.gradle.kts")
          text = app.read_text()

          if "com.google.gms.google-services" not in text:
              text = text.replace(
                  "plugins {",
                  "plugins {\n    id(\"com.google.gms.google-services\")",
                  1
              )
              app.write_text(text)
          PY

      - name: Set application ID
        run: |
          sed -i 's/applicationId = ".*"/applicationId = "com.crazytube.app"/' android/app/build.gradle.kts

      - name: Verify Firebase configuration
        run: |
          echo "Checking Firebase configuration..."
          test -f android/app/google-services.json
          echo "Firebase configuration found."

      - name: Get Flutter packages
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Get APK SHA fingerprints
        run: |
          echo "===== APK SHA FINGERPRINTS ====="
          keytool -printcert -jarfile build/app/outputs/flutter-apk/app-release.apk
          echo "===== END ====="

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CrazyTube-Firebase-APK
          path: build/app/outputs/flutter-apk/app-release.apk
