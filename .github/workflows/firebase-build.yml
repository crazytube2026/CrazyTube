name: Build CrazyTube Firebase APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Android project
        run: |
          flutter create --platforms=android .
          
          sed -i 's/applicationId = ".*"/applicationId = "com.crazytube.app"/' android/app/build.gradle.kts
          sed -i 's/namespace = ".*"/namespace = "com.crazytube.app"/' android/app/build.gradle.kts

      - name: Add Google Services plugin
        run: |
          sed -i '/plugins {/a\    id("com.google.gms.google-services") version "4.4.2" apply false' android/settings.gradle.kts
          sed -i '/plugins {/a\    id("com.google.gms.google-services")' android/app/build.gradle.kts

      - name: Check Firebase config
        run: |
          test -f android/app/google-services.json

      - name: Get packages
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CrazyTube-Firebase-APK
          path: build/app/outputs/flutter-apk/app-release.apk
