name: Build CrazyTube Firebase APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Android project
        run: |
          flutter create --platforms=android --org com.crazytube .

      - name: Copy Firebase configuration
        run: |
          mkdir -p android/app
          cp google-services.json android/app/google-services.json

      - name: Configure Firebase Gradle plugin
        run: |
          python3 - <<'PY'
          from pathlib import Path

          settings = Path("android/settings.gradle.kts")
          text = settings.read_text()

          if "com.google.gms.google-services" not in text:
              text = text.replace(
                  "plugins {",
                  'plugins {\n    id("com.google.gms.google-services") version "4.4.2" apply false',
                  1
              )
              settings.write_text(text)

          app = Path("android/app/build.gradle.kts")
          text = app.read_text()

          if "com.google.gms.google-services" not in text:
              text = text.replace(
                  "plugins {",
                  'plugins {\n    id("com.google.gms.google-services")',
                  1
              )
              app.write_text(text)
          PY

      - name: Set application ID
        run: |
          sed -i 's/applicationId = ".*"/applicationId = "com.crazytube.app"/' android/app/build.gradle.kts
          sed -i 's/namespace = ".*"/namespace = "com.crazytube.app"/' android/app/build.gradle.kts

      - name: Verify Firebase configuration
        run: |
          test -f android/app/google-services.json
          echo "Firebase configuration found."

      - name: Get Flutter packages
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Create signing keystore
        run: |
          keytool -genkeypair \
            -v \
            -keystore crazytube-release.jks \
            -alias crazytube \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass crazytube123 \
            -keypass crazytube123 \
            -dname "CN=CrazyTube, OU=CrazyTube, O=CrazyTube, L=Dhaka, ST=Dhaka, C=BD"

      - name: Sign APK
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)

          "$APKSIGNER" sign \
            --ks crazytube-release.jks \
            --ks-key-alias crazytube \
            --ks-pass pass:crazytube123 \
            --key-pass pass:crazytube123 \
            --out build/app/outputs/flutter-apk/app-release-signed.apk \
            build/app/outputs/flutter-apk/app-release.apk

      - name: Get release SHA fingerprints
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)

          echo "===== CRAZYTUBE RELEASE CERTIFICATE ====="
          "$APKSIGNER" verify --print-certs \
            build/app/outputs/flutter-apk/app-release-signed.apk
          echo "===== END CERTIFICATE ====="

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CrazyTube-Firebase-APK
          path: build/app/outputs/flutter-apk/app-release-signed.apk
